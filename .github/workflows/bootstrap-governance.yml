name: Bootstrap governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: bootstrap-governance-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: bootstrap / governance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # v4.2.2
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate Bootstrap repository mechanics
        shell: bash
        run: ./scripts/bootstrap-check.sh
